# =============================================================================
# HRMS Application - Nginx Alias Configuration
# =============================================================================
# Add this configuration block inside your main server block for hirectx.com
# 
# Example server block structure:
# server {
#     listen 443 ssl;
#     server_name hirectx.com www.hirectx.com;
#     
#     # ... existing SSL and other configurations ...
#     
#     # HRMS Application (add the configuration below)
#     # ... paste the hrms configuration here ...
#     
#     # ... rest of hirectx.com configuration ...
# }
# =============================================================================

# -------------------------------------------------------------------
# HRMS Application Configuration
# Path: /hrms
# Build Folder: /path/to/HRMSUI/build (update this path!)
# -------------------------------------------------------------------

# Define the path to your HRMS build folder (UPDATE THIS PATH!)
# Replace /var/www/hrms with the actual path to your build folder
# Example: /home/user/HRMSUI/build or /var/www/html/hrms

location /hrms {
    # Alias to the build folder (UPDATE THIS PATH!)
    alias /var/www/hrms;
    
    # Try to serve the file directly, then as directory, then fall back to index.html
    # This is essential for React Router client-side routing
    try_files $uri $uri/ /hrms/index.html;
    
    # Enable gzip compression for better performance
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1000;
    
    # Cache static assets (JS, CSS, images)
    location ~* ^/hrms/static/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        alias /var/www/hrms;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }
    
    # Don't cache the index.html to ensure users get the latest version
    location = /hrms/index.html {
        alias /var/www/hrms/index.html;
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}

# -------------------------------------------------------------------
# IMPORTANT NOTES:
# -------------------------------------------------------------------
# 
# 1. UPDATE THE PATH: Replace '/var/www/hrms' with the actual path 
#    to your HRMSUI/build folder on the server.
#
# 2. API ENDPOINTS: Your HRMS app uses a DIFFERENT API endpoint:
#    - HRMS API: https://apihrms.atwpl.com (defined in src/pages/helper.js)
#    - hirectx.com may use its own API endpoints
#    These are already separated in your code, so no proxy needed!
#
# 3. DEPLOYMENT STEPS:
#    a. Build the app: npm run build (or pnpm build)
#    b. Copy the 'build' folder contents to /var/www/hrms (or your chosen path)
#    c. Add this configuration to your Nginx server block
#    d. Test config: sudo nginx -t
#    e. Reload Nginx: sudo systemctl reload nginx
#
# 4. PERMISSIONS: Ensure Nginx can read the files:
#    sudo chown -R nginx:nginx /var/www/hrms
#    sudo chmod -R 755 /var/www/hrms
#
# 5. TESTING URLs:
#    - https://hirectx.com/hrms -> Dashboard/Login
#    - https://hirectx.com/hrms/dashboard -> Dashboard page
#    - https://hirectx.com/hrms/static/js/main.*.js -> Should return JS file
#
# -------------------------------------------------------------------
